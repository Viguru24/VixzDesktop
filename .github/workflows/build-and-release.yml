name: Build and Release Vixz Desktop

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore VixzDesktop.sln

    - name: Build Application
      run: dotnet build VixzDesktop.sln -c Release --no-restore

    - name: Publish Single-File Executable
      run: |
        dotnet publish src/VixzDesktop/VixzDesktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: VixzDesktop-Windows-x64
        path: ./publish/
